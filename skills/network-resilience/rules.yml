prefix: NET

rules:
  - id: NET-001
    rule: Render from local state first; never block first paint on a network call.
    severity: critical
    applies_to: [android, ios, web]
    detect: |
      The initial screen shows a spinner, skeleton, or empty state whose only exit
      is a successful response. Server-rendered pages with no cached fallback.
    remedy: |
      Persist the last known good response and render it immediately, with a quiet
      freshness indicator. Revalidate in the background. The network changes what
      is on screen; it never decides whether anything is on screen.
    evidence:
      - tier: field
        source: Juvo Mobile — 6 markets, Central & South America, 2015–2020
        observation: >
          On congested cells the request neither succeeded nor failed for tens of
          seconds. Screens gated on first response read as a broken app, and users
          force-quit rather than wait.

  - id: NET-002
    rule: Queue every state-changing request durably before attempting it.
    severity: critical
    applies_to: [android, ios, web]
    detect: |
      A handler calls the API directly and holds the user's intent only in memory
      or in component state. Killing the app mid-request loses the action.
    remedy: |
      Write the intent to durable local storage, acknowledge it in the UI, and
      drain the queue from a background worker — WorkManager on Android,
      Background Sync or a persisted outbox on web.
    evidence:
      - tier: vendor
        source: android-workmanager
      - tier: field
        source: gethomespace — Kenya/US, 2020–2022
        observation: >
          Field agents submitted verifications from sites with no usable signal.
          An in-memory retry lost the submission whenever Android reclaimed the
          process, which on 1–2GB devices was routine.

  - id: NET-003
    rule: Every state-changing request carries a client-generated idempotency key.
    severity: critical
    applies_to: [android, ios, web, backend, sms]
    detect: |
      POST handlers with no idempotency key in the header or body, and no
      server-side dedupe window keyed on it.
    remedy: |
      Generate a UUID at intent time — not at send time — persist it with the
      queued request, and reuse it across every retry. The server dedupes on it
      for at least 24 hours and returns the original result.
    evidence:
      - tier: field
        source: Juvo Mobile — 6 markets, Central & South America, 2015–2020
        observation: >
          Ambiguous timeouts caused manual user retries. Without a stable key the
          duplicate was indistinguishable from a second legitimate action, and the
          reconciliation cost fell on support.

  - id: NET-004
    rule: Pending, queued, and failed states are visible and honest in the UI.
    severity: critical
    applies_to: [android, ios, web]
    detect: |
      Optimistic UI that shows an action as complete while it is still queued, or
      a failure that surfaces only as the state silently reverting.
    remedy: |
      Three distinct visual states — queued, sent, confirmed — and a failure state
      that names the cause and the next action. Optimism about rendering speed is
      good; optimism about whether money moved is not.
    evidence:
      - tier: field
        source: IBM Research Africa — Kenya, 2013–2014
        observation: >
          In a wallet, a balance shown without provenance is worse than no balance.
          Users who could not tell cached from confirmed stopped trusting both.
      - tier: field
        source: Juvo Mobile — 6 markets, Central & South America, 2015–2020
        observation: >
          During a network interruption the app continued to show the last cached
          telco balance while disabling purchase. Read stayed available, write was
          honestly blocked, and the product still felt usable rather than broken.

  - id: NET-005
    rule: Set explicit request timeouts sized for the target network, not the default.
    severity: warning
    applies_to: [android, ios, web, backend]
    detect: |
      `fetch` with no `AbortSignal.timeout`, or client defaults inherited from a
      library tuned for broadband.
    remedy: |
      Set timeouts per class of request — short for interactive reads that have a
      cached fallback, long and patient for queued writes that must eventually
      land. A 30-second write on a saturated 3G cell is normal, not an error.

  - id: NET-006
    rule: Retry with capped exponential backoff and jitter; never tight-loop.
    severity: warning
    applies_to: [android, ios, web]
    detect: |
      Fixed-interval retries, unbounded retry counts, or every queued item
      retrying simultaneously on the connectivity-restored event.
    remedy: |
      Exponential backoff with full jitter, a cap, and a dead-letter state after
      the cap. Synchronised retries across a user base flood the same congested
      cell that caused the failure.
    evidence:
      - tier: vendor
        source: aws-backoff-jitter

  - id: NET-007
    rule: Treat the connectivity flag as a hint, not a fact.
    severity: warning
    applies_to: [android, ios, web]
    detect: |
      Logic branching solely on `navigator.onLine` or an OS connectivity callback.
    remedy: |
      Confirm with a cheap authenticated round trip before treating the network as
      usable. Captive portals, exhausted data bundles, and zero-rated walls all
      report a live connection that carries no traffic to your origin.
    evidence:
      - tier: field
        source: Smile Identity — pan-African, 2017–2021
        observation: >
          Depleted prepaid bundles commonly resolve DNS and terminate TLS at an
          operator portal. The device reports online; every API call returns an
          operator upsell page.

  - id: NET-008
    rule: Honour metered-connection and data-saver signals.
    severity: warning
    applies_to: [android, web]
    detect: |
      Prefetching, video autoplay, background sync, or full-resolution images with
      no check of `Save-Data`, `NetworkInfo.isActiveNetworkMetered`, or the
      effective connection type.
    remedy: |
      Drop to low-resolution assets, disable prefetch and autoplay, and defer
      non-urgent sync to unmetered networks. On a prepaid bundle, background data
      you did not authorise is money the user did not agree to spend.

  - id: NET-009
    rule: Declare a conflict-resolution policy for every entity that syncs.
    severity: warning
    applies_to: [android, ios, web, backend]
    detect: |
      Offline writes with no documented policy — last-write-wins applied by
      accident, via whichever request happened to arrive second.
    remedy: |
      Choose per entity and write it down: server-authoritative for balances and
      anything monetary, last-write-wins with a vector clock for user preferences,
      explicit merge UI for user-authored content. Never LWW on money.

  - id: NET-010
    rule: Batch and compress; minimise round trips over payload elegance.
    severity: advisory
    applies_to: [android, ios, web, backend]
    detect: |
      A screen that issues six sequential dependent requests, or uncompressed JSON
      over a link with 400ms+ RTT.
    remedy: |
      Collapse into one request per screen where the backend allows it. On a
      high-latency link, round trips dominate; six 40KB requests are worse than
      one 240KB request. Enable compression, and consider a binary protocol where
      volume justifies the tooling cost.

  - id: NET-011
    rule: Size a partner integration for their slowest component, not for their API's stated limits.
    severity: critical
    applies_to: [backend]
    detect: |
      Capacity planning that treats a partner's documented rate limit as the real
      ceiling. Load testing against the gateway rather than against the system
      behind it. No agreed launch ramp with the partner.
    remedy: |
      Establish the throughput of the partner's core system, not the wrapper in
      front of it. Queue on your side, apply backpressure, circuit-break on their
      degradation, and agree a ramp rather than arriving at full volume on day one.
    evidence:
      - tier: field
        source: Juvo Mobile — 6 markets, Central & South America, 2015–2020
        observation: >
          A telco partner's billing and fulfilment APIs sat behind a modern API
          wrapper, which made them look like a modern service. The systems behind
          it were not instrumented for our launch curve and became a bottleneck
          during scale-up. The wrapper hid the constraint rather than removing it.

  - id: NET-012
    rule: Never let a third party's connectivity probe decide whether your app may call your API.
    severity: critical
    applies_to: [android, ios]
    detect: |
      A request path that short-circuits on a reachability flag — NetInfo's
      `isInternetReachable`, Android's NET_CAPABILITY_VALIDATED, `navigator.onLine`
      plus a probe — before the request is attempted. A reachability probe left at
      its default target (Google's generate_204 or the OS captive-portal check).
      Acceptance testing only on networks where that probe passes.
    remedy: |
      Point the reachability probe at an endpoint you own — a cheap unauthenticated
      no-op on your API, not an aggregated health check — so "reachable" means
      "can reach us". Then treat the result as a hint for UI and retry timing,
      never as a veto: refuse a request only when the device reports no network
      interface at all, and let the request itself be the test. Verify by pointing
      the OS captive-portal URL at a black hole and confirming the app still works.
    evidence:
      - tier: field
        source: Wowzi — Kenya, September 2026
        observation: >
          The creator app's request interceptor rejected every call as "Limited
          internet connectivity" whenever NetInfo reported the internet
          unreachable. On Android that flag is the OS verdict, which is a fetch of
          google.com/generate_204. A phone tether in the office reproduced it:
          the API answered 200 from the same laptop in about a second while
          Google's probe timed out, and the app was dead — 80 rejections in one
          cold start, "couldn't load earnings", nothing tappable — while every
          other app on the device worked. Carriers that throttle or block Google's
          endpoints produce the same outage for everyone on them. Probing our own
          /health and dropping the veto took the same network from 80 rejections
          to zero; the change was thirty lines, the outage would have been total.
