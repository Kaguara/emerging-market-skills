name: Rule change
description: Change the wording, severity, scope, or remedy of an existing rule.
title: "[rule] "
labels: ["rule-change"]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: SIZE-002
    validations:
      required: true

  - type: dropdown
    id: change
    attributes:
      label: What kind of change?
      options:
        - Severity should be raised
        - Severity should be lowered
        - Wording is ambiguous or untestable
        - Remedy is wrong, outdated, or incomplete
        - Scope is wrong (applies_to)
        - Rule should be superseded by a new one
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed change
      description: The exact new wording or value, so this can be applied without a round trip.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: |
        Raising a severity to `critical` requires evidence — field, published, or vendor.
        See docs/EVIDENCE.md. Lowering one only requires an argument.
    validations:
      required: true
