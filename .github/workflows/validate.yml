name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    name: Skill spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Frontmatter, rules schema, ID uniqueness and prefixing, evidence on
      # critical rules, prose/rules table drift, and source key resolution.
      - name: Validate skills
        run: python3 tools/validate_skills.py

      # AGENTS.md is generated from rules.yml. If a rule changed and the file
      # was not regenerated, every non-Claude agent reads a stale rule set.
      - name: Check AGENTS.md is current
        run: |
          python3 tools/build_agents_md.py
          git diff --exit-code AGENTS.md \
            || (echo "AGENTS.md is stale — run: python3 tools/build_agents_md.py"; exit 1)
